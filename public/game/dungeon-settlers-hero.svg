<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Torchlit settlement field map</title>
  <desc id="desc">An original editorial illustration of a small settlement preparing an expedition toward a dungeon entrance.</desc>
  <defs>
